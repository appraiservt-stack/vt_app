<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — User Management</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; }
  .topbar { background: #1a3a5c; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
  .topbar a { color: #fff; text-decoration: none; font-size: 14px; }
  .topbar .nav-links { display: flex; gap: 18px; }
  .container { max-width: 1400px; margin: 30px auto; padding: 0 16px; }
  h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 20px; }
  .table-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  table { width: 100%; border-collapse: collapse; background: #fff; min-width: 1100px; }
  th { background: #1a3a5c; color: #fff; padding: 12px 14px; text-align: left; font-size: 13px; white-space: nowrap; }
  td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid #eee; color: #333; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f7f9fc; }
  .btn-sm { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; color: #fff; }
  .btn-red { background: #c0392b; }
  .btn-red:hover { background: #a93226; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge-active   { background: #e8f8f0; color: #2d6a4f; }
  .badge-trial    { background: #e8f0fe; color: #1a3a5c; }
  .badge-cancelled{ background: #fde8e8; color: #c0392b; }
  .badge-past_due { background: #fff8e1; color: #856404; }
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
  .alert-success { background: #e8f8f0; color: #1e7e4a; border: 1px solid #b7dfc9; }
  .alert-error   { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
  .search-box { padding: 8px 12px; border: 1.5px solid #ccc; border-radius: 6px; font-size: 13px; width: 300px; margin-bottom: 16px; }
  .search-box:focus { outline: none; border-color: #1a3a5c; }
  .create-form { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px 24px; margin-bottom: 24px; }
  .create-form h3 { font-size: 15px; color: #1a3a5c; margin-bottom: 14px; }
  .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; }
  .form-field input, .form-field select { padding: 7px 10px; border: 1.5px solid #ccc; border-radius: 5px; font-size: 13px; min-width: 150px; }
  .form-field input:focus, .form-field select:focus { outline: none; border-color: #1a3a5c; }
  .btn-create { padding: 8px 20px; background: #1a3a5c; color: #fff; border: none; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-create:hover { background: #2d5a8c; }
</style>
</head>
<body>
<div class="topbar">
  <strong>VT Property Sales — User Management</strong>
  <div class="nav-links">
    <a href="/" style="margin-right:12px;">← Back to Map</a>
    <a href="/admin/assessors">Assessors</a>
    <a href="/admin/plans">Plans</a>
    <a href="/admin/content">Content</a>
    <a href="/admin/geocoding">Geocoding</a>
    <a href="/admin/users" style="font-weight:700;">Users</a>
    <a href="/logout">Sign Out</a>
  </div>
</div>
<div class="container">
  <h2>User Management</h2>

  <div id="alert" class="alert"></div>

  <div class="create-form">
    <h3>Create User</h3>
    <div class="form-row">
      <div class="form-field">
        <label>Email *</label>
        <input type="email" id="cu_email" placeholder="user@example.com">
      </div>
      <div class="form-field">
        <label>Password *</label>
        <input type="text" id="cu_password" placeholder="temporary password">
      </div>
      <div class="form-field">
        <label>First Name</label>
        <input type="text" id="cu_first" placeholder="First">
      </div>
      <div class="form-field">
        <label>Last Name</label>
        <input type="text" id="cu_last" placeholder="Last">
      </div>
      <div class="form-field">
        <label>Status</label>
        <select id="cu_status" onchange="toggleTrialEnd()">
          <option value="active">Active</option>
          <option value="trialing">Trialing</option>
        </select>
      </div>
      <div class="form-field">
        <label>Plan</label>
        <select id="cu_plan">
          <option value="plan_monthly">Monthly ($24.95)</option>
          <option value="plan_3month">3-Month ($65.85)</option>
          <option value="plan_6month">6-Month ($113.70)</option>
          <option value="plan_12month">12-Month ($203.40)</option>
        </select>
      </div>
      <div class="form-field" id="trialEndField" style="display:none;">
        <label>Trial Ends</label>
        <input type="date" id="cu_trial_end">
      </div>
      <div class="form-field">
        <label>&nbsp;</label>
        <button class="btn-create" onclick="createUser()">Create User</button>
      </div>
    </div>
  </div>

  <input type="text" class="search-box" id="searchBox" placeholder="Search by email…" oninput="filterRows()">

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Plan</th>
          <th>Joined</th>
          <th>Trial End</th>
          <th>Stripe Customer ID</th>
          <th>Stripe Subscription ID</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
var allUsers = [];

function showAlert(msg, type) {
  var el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function badgeClass(status) {
  if (status === 'active') return 'badge-active';
  if (status === 'trial') return 'badge-trial';
  if (status === 'cancelled') return 'badge-cancelled';
  if (status === 'past_due') return 'badge-past_due';
  return '';
}

function renderRows(users) {
  var tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  users.forEach(function(u) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + esc(u.email) + '</td>' +
      '<td>' + esc(u.first_name || '') + '</td>' +
      '<td>' + esc(u.last_name || '') + '</td>' +
      '<td>' + esc(u.phone || '') + '</td>' +
      '<td><span class="badge ' + badgeClass(u.subscription_status) + '">' + esc(u.subscription_status || '') + '</span></td>' +
      '<td>' + esc(u.plan_key || '') + '</td>' +
      '<td>' + (u.created_at || '').slice(0, 10) + '</td>' +
      '<td>' + (u.trial_ends_at || '').slice(0, 10) + '</td>' +
      '<td>' + esc(u.stripe_customer_id || '') + '</td>' +
      '<td>' + esc(u.stripe_subscription_id || '') + '</td>' +
      '<td><button class="btn-sm btn-red" onclick="deleteUser(\'' + esc(u.email).replace(/'/g, "\\'") + '\')">Delete</button></td>';
    tbody.appendChild(tr);
  });
}

function loadUsers() {
  fetch('/admin/users/list')
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      allUsers = rows;
      filterRows();
    });
}

function filterRows() {
  var q = document.getElementById('searchBox').value.toLowerCase();
  if (!q) { renderRows(allUsers); return; }
  renderRows(allUsers.filter(function(u) {
    return u.email.toLowerCase().indexOf(q) !== -1;
  }));
}

function deleteUser(email) {
  if (!confirm('Are you sure you want to delete ' + email + '?')) return;
  fetch('/admin/users/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { showAlert(d.error, 'error'); return; }
    showAlert('Deleted ' + email, 'success');
    loadUsers();
  })
  .catch(function() { showAlert('Network error', 'error'); });
}

loadUsers();

function toggleTrialEnd() {
  var status = document.getElementById('cu_status').value;
  document.getElementById('trialEndField').style.display =
    status === 'trialing' ? '' : 'none';
}

function createUser() {
  var email    = document.getElementById('cu_email').value.trim();
  var password = document.getElementById('cu_password').value.trim();
  var first    = document.getElementById('cu_first').value.trim();
  var last     = document.getElementById('cu_last').value.trim();
  var status   = document.getElementById('cu_status').value;
  var plan     = document.getElementById('cu_plan').value;
  var trialEnd = document.getElementById('cu_trial_end').value || null;

  if (!email || !password) {
    showAlert('Email and password are required.', 'error');
    return;
  }

  fetch('/admin/users/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email, password: password,
      first_name: first, last_name: last,
      status: status, plan_key: plan,
      trial_ends_at: trialEnd
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { showAlert(d.error, 'error'); return; }
    showAlert('User ' + email + ' created successfully.', 'success');
    // Clear form
    document.getElementById('cu_email').value = '';
    document.getElementById('cu_password').value = '';
    document.getElementById('cu_first').value = '';
    document.getElementById('cu_last').value = '';
    document.getElementById('cu_status').value = 'active';
    document.getElementById('cu_plan').value = 'plan_monthly';
    document.getElementById('cu_trial_end').value = '';
    document.getElementById('trialEndField').style.display = 'none';
    loadUsers();
  })
  .catch(function() { showAlert('Network error', 'error'); });
}
</script>
</body>
</html>
