<!DOCTYPE html>
<html>
<head>
    <title>VT Property Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body { margin:0; display:flex; height:100vh; font-family:Arial; }
        #sidebar { width:300px; padding:10px; background:#f5f5f5; }
        #map { flex:1; }

        .dropdown-box {
            border:1px solid #ccc;
            padding:8px;
            background:white;
            cursor:pointer;
            margin-bottom:5px;
        }

        .dropdown-content {
            display:none;
            border:1px solid #ccc;
            background:white;
            max-height:250px;
            overflow:auto;
            padding:8px;
        }

        .dropdown-content label {
            display:block;
        }

        button {
            width:100%;
            padding:8px;
            margin-top:5px;
        }
    </style>
</head>

<body>

<div id="sidebar">

    <h3>County Filter</h3>

    <div class="dropdown-box" onclick="toggleDropdown()">Select Counties ▼</div>

    <div id="countyDropdown" class="dropdown-content"></div>

    <button onclick="applyCounty()">Finished</button>

    <hr>

    <button onclick="exportSelected()">Export Selected</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= MAP =================
let map = L.map('map', { closePopupOnClick:false })
    .setView([44,-72.7],8);

let street = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {subdomains:'abcd'}
).addTo(map);

let satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

let lightSat = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
);

L.control.layers({
    "Street": street,
    "Light Satellite": lightSat,
    "Satellite": satellite
}).addTo(map);

// ================= COUNTY BOUNDARIES =================
// Public GeoJSON for Vermont counties
let countyLayer = null;

fetch("https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/vermont-counties.geojson")
.then(r=>r.json())
.then(data=>{
    countyLayer = data;
});

// ================= STATE =================
let selectedCounties = [];
let selectedSales = {};
let markers = [];

// ================= LOAD COUNTY LIST =================
fetch("/metadata")
.then(r=>r.json())
.then(data=>{

    let container = document.getElementById("countyDropdown");

    let allLabel = document.createElement("label");
    allLabel.innerHTML = "<input type='checkbox' value='ALL'> Entire State";
    container.appendChild(allLabel);

    data.counties.forEach(name=>{
        let label=document.createElement("label");
        label.innerHTML=`<input type="checkbox" value="${name}"> ${name}`;
        container.appendChild(label);
    });

});

// ================= DROPDOWN =================
function toggleDropdown(){
    let d=document.getElementById("countyDropdown");
    d.style.display = d.style.display==="block"?"none":"block";
}

// ================= APPLY COUNTY =================
function applyCounty(){

    let checked=document.querySelectorAll("#countyDropdown input:checked");
    selectedCounties=[...checked].map(c=>c.value);

    document.getElementById("countyDropdown").style.display="none";

    zoomToCounty();  // 🔥 NEW

    loadData();
}

// ================= ZOOM FUNCTION =================
function zoomToCounty(){

    if(!countyLayer) return;

    // Entire State
    if(selectedCounties.includes("ALL") || selectedCounties.length===0){
        map.setView([44,-72.7],8);
        return;
    }

    let features = countyLayer.features.filter(f=>{
        return selectedCounties.includes(f.properties.name);
    });

    let geo = L.geoJSON(features);
    map.fitBounds(geo.getBounds());
}

// ================= LOAD DATA =================
function loadData(){

    let bounds=map.getBounds();

    let url=`/data?xmin=${bounds.getWest()}&ymin=${bounds.getSouth()}&xmax=${bounds.getEast()}&ymax=${bounds.getNorth()}`;

    selectedCounties.forEach(c=>{
        url+=`&county=${encodeURIComponent(c)}`;
    });

    fetch(url).then(r=>r.json()).then(res=>{

        markers.forEach(m=>map.removeLayer(m));
        markers=[];

        let grouped={};

        res.data.forEach(r=>{
            let key=r.address+"_"+r.city;
            if(!grouped[key]) grouped[key]=[];
            grouped[key].push(r);
        });

        Object.values(grouped).forEach(group=>{

            let r=group[0];
            if(!r.lat) return;

            let isSelected = group.some(s=>selectedSales[s.id]);

            let marker=L.circleMarker([r.lat,r.lon],{
                radius:3,
                color:isSelected?"blue":"black",
                fillOpacity:isSelected?1:0
            }).addTo(map);

            marker.group=group;

            let html="<b>"+r.address+"</b><br>"+r.city+"<br><br><b>Select for Download:</b><br>";

            group.forEach(s=>{
                let checked=selectedSales[s.id]?"checked":"";

                html+=`<input type='checkbox' ${checked}
                        onclick='event.stopPropagation();'
                        onchange='toggleSale("${s.id}",${JSON.stringify(s)})'>
                        $${s.price} | ${s.date}<br>`;
            });

            marker.bindPopup(html,{
                autoClose:false,
                closeOnClick:false
            });

            marker.on("popupopen", function(e){
                setTimeout(()=>{
                    map.closePopup(e.popup);
                },5000);
            });

            markers.push(marker);
        });

    });
}

// ================= SELECTION =================
function toggleSale(id,record){

    if(selectedSales[id]) delete selectedSales[id];
    else selectedSales[id]=record;

    updateMarkerStyles();
}

function updateMarkerStyles(){
    markers.forEach(marker=>{
        let isSelected = marker.group.some(s=>selectedSales[s.id]);

        marker.setStyle({
            color:isSelected?"blue":"black",
            fillOpacity:isSelected?1:0
        });
    });
}

// ================= EXPORT =================
function exportSelected(){
    fetch("/export",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({data:Object.values(selectedSales)})
    }).then(r=>r.blob()).then(blob=>{
        let url=URL.createObjectURL(blob);
        let a=document.createElement("a");
        a.href=url;
        a.download="sales.xlsx";
        a.click();
    });
}

// ================= INIT =================
map.on("moveend",loadData);
loadData();

</script>

</body>
</html>
