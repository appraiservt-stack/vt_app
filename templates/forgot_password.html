<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password — VT Property Sales</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1a3a5c 0%, #2d6a4f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); padding: 40px 36px; width: 100%; max-width: 400px; }
  h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 8px; }
  p { font-size: 13px; color: #666; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }
  input[type=email] { width: 100%; padding: 10px 12px; border: 1.5px solid #ccc; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: #1a3a5c; }
  .btn { display: block; width: 100%; padding: 12px; margin-top: 20px; background: #1a3a5c; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #16304d; }
  .links { text-align: center; margin-top: 16px; font-size: 13px; }
  .links a { color: #1a3a5c; text-decoration: none; font-weight: 600; }
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  .alert-info { background: #e8f0fe; color: #1a3a5c; border: 1px solid #b3c6f5; }
  .alert-error { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
</style>
</head>
<body>
<div class="card">
  <h2>Reset Password</h2>
  <p>Enter your email address and we'll send you a reset link.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com">
    <button type="submit" class="btn">Send Reset Link</button>
  </form>
  <div class="links" style="margin-top:16px;">
    <a href="/login">← Back to login</a>
  </div>
</div>
</body>
</html>
