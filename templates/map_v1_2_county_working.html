<!DOCTYPE html>
<html>
<head>
    <title>VT Property Transfer Tool</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body { margin:0; font-family: Arial; }
        #container { display:flex; height:100vh; }
        #sidebar { width:300px; border-right:1px solid #ccc; padding:10px; overflow:auto; }
        #map { flex:1; }

        .dropdown-box {
            border:1px solid #ccc;
            padding:6px;
            cursor:pointer;
            background:#f5f5f5;
            margin-bottom:5px;
        }

        .dropdown-content {
            display:none;
            border:1px solid #ccc;
            padding:5px;
            max-height:250px;
            overflow:auto;
            background:white;
        }
    </style>
</head>

<body>

<div id="container">

    <div id="sidebar">
        <h3>Filters</h3>

        <div class="dropdown-box" onclick="toggleCountyDropdown()">
            Select Counties
        </div>

        <div id="countyDropdown" class="dropdown-content">
            <label>
                <input type="checkbox" onclick="selectAllCounties(this)">
                Entire State
            </label><br><br>

            <div id="countyList"></div>

            <br>
            <button onclick="finishCountySelection()">Finished</button>
        </div>

    </div>

    <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= COUNTY MAP =================
const countyMap = {
"01":"Addison",
"02":"Bennington",
"03":"Caledonia",
"04":"Chittenden",
"05":"Essex",
"06":"Franklin",
"07":"Grand Isle",
"08":"Lamoille",
"09":"Orange",
"10":"Orleans",
"11":"Rutland",
"12":"Washington",
"13":"Windham",
"14":"Windsor"
};

const countyReverse = {};
for (let code in countyMap){
    countyReverse[countyMap[code]] = code;
}

const counties = Object.values(countyMap).sort((a,b)=>a.localeCompare(b));
let selectedCounties = [];

// 🔥 COUNTY CENTER POINTS (APPROXIMATE)
const countyCenters = {
"Addison":[44.015,-73.167],
"Bennington":[42.878,-73.196],
"Caledonia":[44.416,-72.023],
"Chittenden":[44.463,-73.083],
"Essex":[44.801,-71.998],
"Franklin":[44.840,-72.882],
"Grand Isle":[44.722,-73.289],
"Lamoille":[44.562,-72.686],
"Orange":[44.005,-72.368],
"Orleans":[44.814,-72.204],
"Rutland":[43.610,-72.972],
"Washington":[44.260,-72.575],
"Windham":[42.997,-72.655],
"Windsor":[43.480,-72.384]
};

// ================= MAP =================
let map = L.map('map').setView([44,-72.7],8);

let street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
let light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
let satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
);

street.addTo(map);

let activeBase = "street";

map.on("baselayerchange", function(e){
    activeBase = e.name.toLowerCase();
    loadData();
});

L.control.layers({
    "Street": street,
    "Light Satellite": light,
    "Satellite": satellite
}).addTo(map);

// ================= STATE =================
let markersLayer = L.layerGroup().addTo(map);
let selectedSales = {};
let markerRefs = {};
let popupTimer = null;
let hoverTimer = null;
let hoverEnabled = true;

// ================= COUNTY UI =================
function buildCountyList(){
    let html = "";
    counties.forEach(c=>{
        html += `<label>
        <input type="checkbox" value="${c}" onclick="updateCountySelection(this)">
        ${c}
        </label><br>`;
    });
    document.getElementById("countyList").innerHTML = html;
}
buildCountyList();

function toggleCountyDropdown(){
    let d = document.getElementById("countyDropdown");
    d.style.display = d.style.display === "block" ? "none" : "block";
}

function selectAllCounties(cb){
    let checked = cb.checked;
    selectedCounties = checked ? [...counties] : [];

    document.querySelectorAll('#countyList input').forEach(c=>{
        c.checked = checked;
    });
}

function updateCountySelection(cb){
    if(cb.checked){
        if(!selectedCounties.includes(cb.value)){
            selectedCounties.push(cb.value);
        }
    } else {
        selectedCounties = selectedCounties.filter(c=>c !== cb.value);
    }
}

function finishCountySelection(){

    document.getElementById("countyDropdown").style.display = "none";

    // 🔥 AUTO CENTER MAP
    if(selectedCounties.length === 1){
        let center = countyCenters[selectedCounties[0]];
        if(center){
            map.setView(center, 10);
        }
    }

    loadData();
}

// ================= LOAD DATA =================
function loadData(){

    let b = map.getBounds();

    let countyCodes = selectedCounties.map(c => countyReverse[c]).join(",");

    let url = `/data?xmin=${b.getWest()}&ymin=${b.getSouth()}&xmax=${b.getEast()}&ymax=${b.getNorth()}`;

    if(countyCodes){
        url += `&counties=${countyCodes}`;
    }

    fetch(url)
    .then(r=>r.json())
    .then(data=>{

        markersLayer.clearLayers();
        markerRefs = {};

        let grouped = {};

        data.data.forEach(p=>{
            let key = p.address + "_" + p.city;
            if(!grouped[key]) grouped[key] = [];
            grouped[key].push(p);
        });

        Object.keys(grouped).forEach(key=>{

            let sales = grouped[key];
            let p = sales[0];

            let lat = p.lat + 0.00005;
            let lon = p.lon + 0.00005;

            let baseColor = (activeBase === "satellite") ? "red" : "black";
            let isSelected = sales.some(s => selectedSales[s.id]);

            let marker = L.circleMarker([lat,lon],{
                radius:5,
                color: isSelected ? "blue" : baseColor,
                fillColor: isSelected ? "blue" : baseColor,
                fillOpacity: isSelected ? 1 : 0,
                weight:2
            });

            sales.forEach(s=>{
                markerRefs[s.id] = { marker: marker, sales: sales, prop: p };
            });

            let html = buildPopupHTML(p, sales);
            marker.bindPopup(html);

            marker.on('mouseover', function(){
                if(!hoverEnabled) return;
                hoverTimer = setTimeout(()=>{ marker.openPopup(); }, 700);
            });

            marker.on('mouseout', function(){
                if(hoverTimer) clearTimeout(hoverTimer);
                if(hoverEnabled){
                    setTimeout(()=>{ map.closePopup(); }, 300);
                }
            });

            markersLayer.addLayer(marker);
        });
    });
}

// ================= POPUP =================
function buildPopupHTML(p, sales){

    let html = `<b>${p.address}</b><br>${p.city}<br><br>`;
    html += `<b>Select for Download:</b><br>`;

    sales.forEach(s=>{
        let checked = selectedSales[s.id] ? "checked" : "";

        html += `
        <input type="checkbox" ${checked}
        onclick="event.stopPropagation(); toggleSale('${s.id}')">
        Sale: $${s.price} | ${formatDate(s.date)}<br>
        `;
    });

    return html;
}

function formatDate(ms){
    if(!ms) return "";
    let d = new Date(ms);
    return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();
}

// ================= SELECT =================
function toggleSale(id){

    if(selectedSales[id]){
        delete selectedSales[id];
    } else {
        selectedSales[id] = true;
    }

    let ref = markerRefs[id];

    if(ref){
        let marker = ref.marker;

        marker.setStyle({
            color:"blue",
            fillColor:"blue",
            fillOpacity:1
        });

        let newHTML = buildPopupHTML(ref.prop, ref.sales);
        marker.setPopupContent(newHTML);
        marker.openPopup();
    }
}

// ================= POPUP CONTROL =================
map.on('popupopen', function(){

    hoverEnabled = false;

    if(popupTimer){
        clearTimeout(popupTimer);
    }

    popupTimer = setTimeout(()=>{
        map.closePopup();
    }, 8000);

});

map.on('popupclose', function(){
    hoverEnabled = true;
});

// ================= EVENTS =================
map.on("moveend", loadData);

// ================= INIT =================
loadData();

</script>

</body>
</html>
