<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — VT Property Sales</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1a3a5c 0%, #2d6a4f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); padding: 40px 36px; width: 100%; max-width: 400px; }
  h2 { font-size: 20px; color: #1a3a5c; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; margin-top: 16px; }
  input[type=password] { width: 100%; padding: 10px 12px; border: 1.5px solid #ccc; border-radius: 6px; font-size: 14px; }
  input:focus { outline: none; border-color: #1a3a5c; }
  .btn { display: block; width: 100%; padding: 12px; margin-top: 24px; background: #1a3a5c; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #16304d; }
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  .alert-error { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6c6; }
</style>
</head>
<body>
<div class="card">
  <h2>Set New Password</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="hidden" name="token" value="{{ token }}">
    <label>New Password</label>
    <input type="password" name="password" required placeholder="••••••••" minlength="8">
    <label>Confirm Password</label>
    <input type="password" name="confirm" required placeholder="••••••••">
    <button type="submit" class="btn">Update Password</button>
  </form>
</div>
</body>
</html>
